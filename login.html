
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="same-origin">

    <title>Área do Proprietário | CEMO Imobiliária</title>

    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>

<body>
    <main class="login-container">
        <section class="login-box" aria-labelledby="titulo-login">

            <a class="voltar-site" href="imobiliaria.html">
                ← Voltar ao site
            </a>

            <div class="logo-login">
                <img
                    src="assets/logo-admin.png"
                    alt="CEMO Imobiliária"
                    width="220"
                >
            </div>

            <div class="login-cabecalho">
                <span class="login-etiqueta">ACESSO RESTRITO</span>

                <h1 id="titulo-login">Área do Proprietário</h1>

                <p>
                    Entre com suas credenciais para administrar os imóveis.
                </p>
            </div>

            <form id="form-login" action="login.php" method="post">
                <div class="campo-login">
                    <label for="usuario">Usuário</label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Digite seu usuário"
                        autocomplete="username"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="campo-login">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        maxlength="128"
                        required
                    >
                </div>

                <p
                    id="mensagem-login"
                    class="mensagem-login"
                    role="alert"
                    aria-live="polite"
                    hidden
                ></p>

                <button
                    id="botao-login"
                    type="submit"
                >
                    Entrar com segurança
                </button>
            </form>

            <div class="aviso-seguranca">
                <span aria-hidden="true">🔒</span>
                Acesso exclusivo ao responsável pela imobiliária.
            </div>

            <footer class="login-rodape">
                CEMO Imobiliária
            </footer>
        </section>
    </main>
</body>
</html>
